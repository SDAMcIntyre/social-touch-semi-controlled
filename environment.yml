name: social-touch
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip

  # --- PCL (Point Cloud Library) — conda-forge only ---
  - pcl>=1.14
  - python-pcl>=0.3.0rc1

  # --- VTK — C++ library; installed via conda for PCL ABI compatibility ---
  - vtk>=9.4

  # --- Core scientific (MKL-linked builds from conda) ---
  - numpy>=2.0
  - scipy>=1.15

  # --- Media / codecs (needed by OpenCV for video I/O) ---
  - ffmpeg

  - pip:
      # --- Core Scientific Computing & Data Analysis ---
      - h5py>=3.14
      - matplotlib>=3.10
      - pandas>=2.3
      - scikit-image>=0.25
      - scikit-learn>=1.7
      - tifffile>=2025.5

      # --- 3D, Visualization & Geometry ---
      - chumpy>=0.70
      - open3d>=0.19
      - plyfile>=1.1
      - pygltflib>=1.16
      - pyvista>=0.46
      - pyvistaqt>=0.11
      - transforms3d>=0.4
      - trimesh>=4.7

      # --- Image & Computer Vision ---
      - opencv-contrib-python>=4.12
      - Pillow>=11
      - seaborn

      # --- Pydantic & Data Validation ---
      - pydantic>=2.11
      - pydantic-core>=2.33
      - pydantic-extra-types>=2.10
      - pydantic-settings>=2.10

      # --- GUI Framework ---
      - PyQt5>=5.15
      - PyQt5-Qt5>=5.15
      - PyQt5-sip>=12
      - QtPy>=2.4
      - qimage2ndarray>=1.10

      # --- Workflow Orchestration ---
      - prefect>=3.4

      # --- GPU Acceleration (optional, CUDA 12.x+) ---
      # Install separately after environment creation:
      #   pip install cupy-cuda12x
      # - cupy-cuda12x>=13.0

      # --- Machine Learning (manual installs) ---
      # torch: install with the correct CUDA wheel for your system, e.g.:
      #   pip install torch --index-url https://download.pytorch.org/whl/cu121
      # tensorflow: only required by HaMeR inference (wrappers.py / network.py)

      # --- Data & Serialization ---
      - openpyxl
      - PyYAML>=6.0
      - ruamel.yaml>=0.18

      # --- Logging ---
      - loguru>=0.7
      - rich>=14

      # --- I/O & Hardware ---
      - pyk4a>=1.5; sys_platform == "win32"
      - pyserial>=3.5
      - pywin32>=311; sys_platform == "win32"

      # --- Visualization & Plotting ---
      - plotly>=6

      # --- Utilities ---
      - filelock>=3
      - joblib>=1.5
      - keyboard
      - networkx>=3.4
      - psutil>=7
      - psychopy>=2025.1
      - pygame>=2.6
      - pynput>=1.8
      - requests>=2.32
      - tqdm>=4.67
      - typer>=0.16

      # --- Project package (editable install) ---
      - -e .
