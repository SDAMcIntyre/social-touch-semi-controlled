# Dependency-aware configuration for the Analysis Workflow.
# Specifies input directories and task toggle states.

parameters:
  # List of directories containing Kinect session config files to scan.
  # Paths are relative to configs/kinect_configs/.
  kinect_configs: [valid_configs_ST13-01, valid_configs_ST13-02, 
      valid_configs_ST13-03, valid_configs_ST14-01, valid_configs_ST14-02, 
      valid_configs_ST14-03, valid_configs_ST14-04, valid_configs_ST15-01, 
      valid_configs_ST15-02, valid_configs_ST16-02, valid_configs_ST16-03, 
      valid_configs_ST16-04, valid_configs_ST16-05, valid_configs_ST18-01, 
      valid_configs_ST18-04]

tasks:
  # --- Analysis Tasks ---
  # Block/trial structure summary. No dependencies.
  summarize_session_blocks:
    enabled: true
    options:
      force_processing: false
    depends_on: []

  # Simple RF mapping: raw spike-position CSV + forearm heatmap per session.
  # Runs before feature extraction — no dependency on clustering or extraction.
  # Output: 4_analysed/receptive_field_maps_simple/<session_id>/
  map_receptive_fields_simple:
    enabled: true
    options:
      force_processing: false
      show_interactive: false
      projection_method: cylindrical_unwrap
    depends_on: []

  # Stage 2a (Series Transforms): Per-session kinematics, pressure, and MoS computation.
  # Adds velocity_magnitude, acceleration_magnitude, geo_pressure, and (when enabled) MoS
  # columns to each session CSV.
  # Output: 4_analysed/series_transforms/<session>_series_augmented.csv
  touch_series_transforms:
    enabled: true
    options:
      force_processing: false
      transforms:
        kinematics:
          enabled: true
          fps: 30.0
        pressure:
          enabled: true
        mechanics_of_solids:
          enabled: false
          youngs_modulus_kpa: 100.0
          poissons_ratio: 0.45
          skin_thickness_mm: 1.5
    depends_on: []

  # Stage 2b (Feature Extraction): Per-session feature extraction. Each enabled feature extracts to its own folder.
  # Output: 4_analysed/touch_features/<feature>/<session>_touch_summary.csv
  touch_feature_extraction:
    enabled: true
    options:
      force_processing: false
      # Each key is a feature name. Kinematic aggregations (max, mean, min, median, std, range,
      # skewness) use StatisticalExtractor internally. Whole-touch features (temporal,
      # mechanics_of_solids) use their own extractor. Set enabled: true to activate.
      features:
        max:
          enabled: true
        mean:
          enabled: true
        min:
          enabled: true
        median:
          enabled: true
        std:
          enabled: true
        range:
          enabled: true
        skewness:
          enabled: true
        pressure_velocity_mean: {enabled: true}
        pressure_velocity_max: {enabled: true}
        temporal:
          enabled: false
        mechanics_of_solids:
          enabled: false
          youngs_modulus_kpa: 100.0
          poissons_ratio: 0.45
          skin_thickness_mm: 1.5
        touch_category: {enabled: true}
    depends_on: [touch_series_transforms]

  # Stages 3–5 (Reduction + Clustering + Evaluation): Global clustering on pooled feature CSVs.
  # Each cluster_group defines which data types / aggregations to use and its own clustering_methods.
  # Output: 4_analysed/touch_clusters/<group_name>/<clusterer>/
  touch_clustering:
    enabled: true
    options:
      force_processing: false
      cluster_groups:
        kinematics_mean:
          enabled: true
          features:
            contact_depth: [mean]
            contact_area: [mean]
            velocity: [mean]
            acceleration: [mean]
            location: [mean]
          clustering_methods:
            binning:
              method: binning
              n_bins: 20
              bin_method: equal_width
              enabled: true
            type_stratified:
              method: type_stratified
              base_method: binning
              type_col: type_metadata
              n_bins: 20
              bin_method: equal_width
              enabled: true
        kinematics_max:
          enabled: false
          features:
            contact_depth: [max]
            contact_area: [max]
            velocity: [max]
            acceleration: [max]
          clustering_methods:
            binning:
              method: binning
              n_bins: 20
              bin_method: equal_width
              enabled: true
        kinematics_with_category:
          enabled: false
          features:
            contact_depth: [mean]
            contact_area: [mean]
            velocity: [mean]
            acceleration: [mean]
            location: [mean]
            touch_category: []
          clustering_methods:
            binning:
              method: binning
              n_bins: 20
              bin_method: equal_width
              enabled: true
      reduction:
        scaler: standard
        variance_filter: null
        decomposition: null
      evaluation:
        internal_metrics: [silhouette, davies_bouldin, calinski_harabasz]
        stability:
          method: bootstrap
          n_rounds: 20
          subsample_fraction: 0.8
          score: adjusted_rand_index
    depends_on: [touch_feature_extraction]

  # Post-pipeline analysis: Statistical comparison of sensor measurements across strata.
  # Discovers clustered CSVs on disk — references cluster_groups by name from touch_clustering.
  # Output: 4_analysed/touch_comparisons/<group_name>/<clusterer>/
  touch_comparing:
    enabled: false
    options:
      force_processing: false
      cluster_groups: [kinematics_mean]
      comparing_profiles:
        bias:
          method: bias
          measurement_col: spike_elicited
          sensor_col: session_id
          alpha: 0.05
        precision:
          method: precision
          measurement_col: spike_elicited
          sensor_col: session_id
        distribution:
          method: distribution
          measurement_col: spike_elicited
          sensor_col: session_id
      min_instances_per_sensor: 5
      min_sensor_types: 2
    depends_on: [touch_clustering]

  # Consumes output from touch_feature_extraction
  analyse_ap_efficacy:
    enabled: true
    options:
      force_processing: false
    depends_on: [touch_feature_extraction]

  # Cluster-based RF mapping: spike-count heatmaps grouped by data-driven cluster labels.
  # Reads from touch_clustering output; renders 3D forearm heatmap PNGs per (cluster, session).
  # Output: 4_analysed/receptive_field_maps_clustered/<combination>/<clusterer>/
  map_receptive_fields_clustered:
    enabled: true
    options:
      force_processing: false
      # enabled: true → face-on camera computed automatically (no GUI).
      # enabled: false → interactive picker (manual). force_processing also
      # controls whether sessions with existing camera_params.json are re-shown.
      camera_angle_mode:
        auto:
          enabled: true
      cluster_groups: [kinematics_mean]
      projection_method: cylindrical_unwrap
    depends_on: [touch_clustering]
