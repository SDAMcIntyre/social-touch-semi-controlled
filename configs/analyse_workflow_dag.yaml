# Dependency-aware configuration for the Analysis Workflow.
# Specifies input directories and task toggle states.

parameters:
  # List of directories containing Kinect JSON config files to scan.
  # Paths are relative to the project 'configs' directory.
  kinect_configs_directories:
    - "kinect_configs/valid_configs_ST13-01"
    - "kinect_configs/valid_configs_ST13-02"
    - "kinect_configs/valid_configs_ST13-03"

    - "kinect_configs/valid_configs_ST14-01_ST14-02"
    - "kinect_configs/valid_configs_ST14-03_ST14-04"
  
    - "kinect_configs/valid_configs_ST15-01_ST15-02"

    - "kinect_configs/valid_configs_ST16-02"
    - "kinect_configs/valid_configs_ST16-03_ST16-04"
    - "kinect_configs/valid_configs_ST16-05"

    - "kinect_configs/valid_configs_ST18-01"
    - "kinect_configs/valid_configs_ST18-02_ST18-04"

tasks:
  # --- Analysis Tasks ---
  analyse_number_single_touches:
    enabled: true
    options:
      force_processing: false
    depends_on: []