# Dependency-aware configuration for the Analysis Workflow.
# Specifies input directories and task toggle states.

parameters:
  # List of directories containing Kinect session config files to scan.
  # Paths are relative to configs/kinect_configs/.
  kinect_configs: [valid_configs_ST13-01, valid_configs_ST13-02, 
      valid_configs_ST13-03, valid_configs_ST14-01, 
      valid_configs_ST14-02/kinect_config_2022-06-15_ST14-02_semicontrolled_block-order01.yaml,
    valid_configs_ST14-02/kinect_config_2022-06-15_ST14-02_semicontrolled_block-order02.yaml,
    valid_configs_ST14-02/kinect_config_2022-06-15_ST14-02_semicontrolled_block-order04.yaml,
    valid_configs_ST14-02/kinect_config_2022-06-15_ST14-02_semicontrolled_block-order05.yaml,
    valid_configs_ST14-02/kinect_config_2022-06-15_ST14-02_semicontrolled_block-order06.yaml,
    valid_configs_ST14-02/kinect_config_2022-06-15_ST14-02_semicontrolled_block-order08.yaml,
    valid_configs_ST14-03, valid_configs_ST14-04, valid_configs_ST15-01, 
      valid_configs_ST15-02/kinect_config_2022-06-16_ST15-02_semicontrolled_block-order01.yaml,
    valid_configs_ST16-02/kinect_config_2022-06-17_ST16-02_semicontrolled_block-order01.yaml,
    valid_configs_ST16-02/kinect_config_2022-06-17_ST16-02_semicontrolled_block-order02.yaml,
    valid_configs_ST16-02/kinect_config_2022-06-17_ST16-02_semicontrolled_block-order03.yaml,
    valid_configs_ST16-02/kinect_config_2022-06-17_ST16-02_semicontrolled_block-order04.yaml,
    valid_configs_ST16-02/kinect_config_2022-06-17_ST16-02_semicontrolled_block-order05.yaml,
    valid_configs_ST16-02/kinect_config_2022-06-17_ST16-02_semicontrolled_block-order06.yaml,
    valid_configs_ST16-02/kinect_config_2022-06-17_ST16-02_semicontrolled_block-order07.yaml,
    valid_configs_ST16-02/kinect_config_2022-06-17_ST16-02_semicontrolled_block-order08.yaml,
    valid_configs_ST16-02/kinect_config_2022-06-17_ST16-02_semicontrolled_block-order09.yaml,
    valid_configs_ST16-02/kinect_config_2022-06-17_ST16-02_semicontrolled_block-order10.yaml,
    valid_configs_ST16-02/kinect_config_2022-06-17_ST16-02_semicontrolled_block-order11.yaml,
    valid_configs_ST16-02/kinect_config_2022-06-17_ST16-02_semicontrolled_block-order12.yaml,
    valid_configs_ST16-02/kinect_config_2022-06-17_ST16-02_semicontrolled_block-order13.yaml,
    valid_configs_ST16-02/kinect_config_2022-06-17_ST16-02_semicontrolled_block-order14.yaml,
    valid_configs_ST16-02/kinect_config_2022-06-17_ST16-02_semicontrolled_block-order15.yaml,
    valid_configs_ST16-03, valid_configs_ST16-04, valid_configs_ST16-05, 
      valid_configs_ST18-01, valid_configs_ST18-04]

tasks:
  # --- Analysis Tasks ---
  # Step 1: Block/trial structure summary. No dependencies.
  summarize_session_blocks:
    enabled: true
    options:
      force_processing: true
    depends_on: []

  # Stage 1: Per-session feature extraction. Writes one CSV per (session, profile).
  # Output: 4_analysed/touch_features/<profile>/<session>_touch_summary.csv
  touch_feature_extraction:
    enabled: true
    options:
      force_processing: false
      extraction_profiles:
        max:
          method: max
        statistical:
          method: statistical
          aggregations: [mean, median, std, min, max, range, skewness]
        temporal:
          method: temporal
          enabled: false
        mos:
          method: mechanics_of_solids
          youngs_modulus_kpa: 100.0
          poissons_ratio: 0.45
          skin_thickness_mm: 1.5
          enabled: false
    depends_on: []

  # Stage 2: Global clustering on pooled extraction CSVs.
  # Discovers extraction CSVs on disk — no explicit file list needed.
  # Output: 4_analysed/touch_clusters/<profile>/<clusterer>/
  touch_clustering:
    enabled: true
    options:
      force_processing: false
      extraction_profiles:
        max: {method: max}
        statistical: {method: statistical}
        temporal: {method: temporal, enabled: false}
        mos: {method: mechanics_of_solids, enabled: false}
      clustering_profiles:
        kmeans:
          method: kmeans
          min_touches_per_cluster: 30
        dbscan:
          method: dbscan
          eps: auto
          min_touches_per_cluster: 30
        hierarchical:
          method: hierarchical
          min_instances_per_sensor: 5
          min_sensor_types: 2
          sensor_col: session_id
        binning:
          method: binning
          n_bins: 20
          bin_method: equal_width
    depends_on: [touch_feature_extraction]

  # Stage 3: Statistical comparison of sensor measurements across strata.
  # Discovers clustered CSVs on disk — no explicit file list needed.
  # Output: 4_analysed/touch_comparisons/<profile>/<clusterer>/
  touch_comparing:
    enabled: false
    options:
      force_processing: false
      extraction_profiles:
        max: {method: max}
      clustering_profiles:
        hierarchical: {method: hierarchical, enabled: false}
      comparing_profiles:
        bias:
          method: bias
          measurement_col: spike_elicited
          sensor_col: session_id
          alpha: 0.05
        precision:
          method: precision
          measurement_col: spike_elicited
          sensor_col: session_id
        distribution:
          method: distribution
          measurement_col: spike_elicited
          sensor_col: session_id
      min_instances_per_sensor: 5
      min_sensor_types: 2
    depends_on: [touch_clustering]

  # Consumes output from touch_feature_extraction
  analyse_ap_efficacy:
    enabled: false
    options:
      force_processing: false
    depends_on: [touch_feature_extraction]

  # RF mapping via selectivity + DBSCAN. Requires unified touch summaries.
  map_receptive_fields:
    enabled: false
    options:
      grouping_columns: ['type_metadata', 'direction']
      monitor: false
      force_processing: false
    depends_on: [touch_feature_extraction]
