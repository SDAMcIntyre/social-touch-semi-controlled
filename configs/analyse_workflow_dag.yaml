# Dependency-aware configuration for the Analysis Workflow.
# Specifies input directories and task toggle states.

parameters:
  # List of directories containing Kinect session config files to scan.
  # Paths are relative to configs/kinect_configs/.
  kinect_configs: [valid_configs_ST13-01, valid_configs_ST13-02, 
      valid_configs_ST13-03, valid_configs_ST14-01, valid_configs_ST14-02, 
      valid_configs_ST14-03, valid_configs_ST14-04, valid_configs_ST15-01, 
      valid_configs_ST15-02, valid_configs_ST16-02, valid_configs_ST16-03, 
      valid_configs_ST16-04, valid_configs_ST16-05, valid_configs_ST18-01, 
      valid_configs_ST18-04]

tasks:
  # --- Analysis Tasks ---
  # Step 1: Block/trial structure summary. No dependencies.
  summarize_session_blocks:
    enabled: true
    options:
      force_processing: false
    depends_on: []

  # Simple RF mapping: raw spike-position CSV + forearm heatmap per session.
  # Runs before feature extraction — no dependency on clustering or extraction.
  # Output: 4_analysed/receptive_field_maps_simple/<session_id>/
  map_receptive_fields_simple:
    enabled: true
    options:
      force_processing: false
      show_interactive: false
      projection_method: cylindrical_unwrap
    depends_on: []

  # Stage 1: Per-session feature extraction. Each enabled feature extracts to its own folder.
  # Output: 4_analysed/touch_features/<feature>/<session>_touch_summary.csv
  touch_feature_extraction:
    enabled: true
    options:
      force_processing: false
      # Each key is a feature name. Kinematic aggregations (max, mean, min, median, std, range,
      # skewness) use StatisticalExtractor internally. Whole-touch features (temporal,
      # mechanics_of_solids) use their own extractor. Set enabled: true to activate.
      features:
        max:
          enabled: false
        mean:
          enabled: true
        min: {}
        median: {}
        std: {}
        range:
          enabled: false
        skewness:
          enabled: false
        pressure_velocity_mean: {enabled: true}
        pressure_velocity_max: {enabled: true}
        temporal:
          enabled: false
        mechanics_of_solids:
          enabled: false
          youngs_modulus_kpa: 100.0
          poissons_ratio: 0.45
          skin_thickness_mm: 1.5
        touch_category: {enabled: true}
    depends_on: []

  # Stage 2: Global clustering on pooled feature CSVs.
  # Each enabled feature_combination merges the listed feature folders and runs
  # each enabled clustering_profile — cross-product of combinations x clusterers.
  # Output: 4_analysed/touch_clusters/<combination>/<clusterer>/
  touch_clustering:
    enabled: true
    options:
      force_processing: false
      feature_combinations:
        basic:
          features: [mean]
          enabled: false
        kinematic_full:
          enabled: false
          features: [max, mean]
        all_features:
          enabled: false
          features: [max, mean, temporal, mechanics_of_solids]
        only_mean:
          enabled: true
          features: [mean]
        only_max:
          enabled: false
          features: [max]
        only_median:
          enabled: false
          features: [median]
        pressure_velocity_mean:
          enabled: true
          features: [pressure_velocity_mean]
        pressure_velocity_max:
          enabled: true
          features: [pressure_velocity_max]
        touch_category:
          enabled: false
          features: [touch_category]
        pressure_and_category:
          enabled: false
          features: [pressure_velocity_mean, touch_category]
        pressure_velocity_mean_and_type:
          enabled: true
          features: [pressure_velocity_mean, touch_category]
      clustering_profiles:
        binning:
          method: binning
          n_bins: 20
          bin_method: equal_width
        kmeans:
          method: kmeans
          min_touches_per_cluster: 30
          enabled: false
        dbscan:
          method: dbscan
          eps: auto
          min_touches_per_cluster: 30
          enabled: false
        hierarchical:
          method: hierarchical
          min_instances_per_sensor: 5
          min_sensor_types: 2
          sensor_col: session_id
          enabled: false
        type_stratified:
          method: type_stratified
          base_method: binning
          type_col: type_metadata
          n_bins: 20
          bin_method: equal_width
    depends_on: [touch_feature_extraction]

  # Stage 3: Statistical comparison of sensor measurements across strata.
  # Discovers clustered CSVs on disk — no explicit file list needed.
  # Output: 4_analysed/touch_comparisons/<combination>/<clusterer>/
  touch_comparing:
    enabled: false
    options:
      force_processing: false
      feature_combinations:
        basic:
          enabled: false
          features: [max]
      clustering_profiles:
        hierarchical: {method: hierarchical, enabled: false}
      comparing_profiles:
        bias:
          method: bias
          measurement_col: spike_elicited
          sensor_col: session_id
          alpha: 0.05
        precision:
          method: precision
          measurement_col: spike_elicited
          sensor_col: session_id
        distribution:
          method: distribution
          measurement_col: spike_elicited
          sensor_col: session_id
      min_instances_per_sensor: 5
      min_sensor_types: 2
    depends_on: [touch_clustering]

  # Consumes output from touch_feature_extraction
  analyse_ap_efficacy:
    enabled: true
    options:
      force_processing: false
    depends_on: [touch_feature_extraction]

  # Cluster-based RF mapping: spike-count heatmaps grouped by data-driven cluster labels.
  # Reads from touch_clustering output; renders 3D forearm heatmap PNGs per (cluster, session).
  # Output: 4_analysed/receptive_field_maps_clustered/<combination>/<clusterer>/
  map_receptive_fields_clustered:
    enabled: true
    options:
      force_processing: false
      # enabled: true → face-on camera computed automatically (no GUI).
      # enabled: false → interactive picker (manual). force_processing also
      # controls whether sessions with existing camera_params.json are re-shown.
      camera_angle_mode:
        auto:
          enabled: true
      feature_combinations:
        only_mean: {enabled: true, features: [mean]}
        only_max: {enabled: false, features: [max]}
        only_median: {enabled: false, features: [median]}
        pressure_velocity_mean:
          enabled: true
          features: [pressure_velocity_mean]
        pressure_velocity_max:
          enabled: true
          features: [pressure_velocity_max]
        touch_category:
          enabled: false
          features: [touch_category]
        pressure_and_category:
          enabled: false
          features: [pressure_velocity_mean, touch_category]
        pressure_velocity_mean_and_type:
          enabled: true
          features: [pressure_velocity_mean, touch_category]
      projection_method: cylindrical_unwrap
      clustering_profiles:
        binning: {method: binning}
        kmeans: {method: kmeans, enabled: false}
        dbscan: {method: dbscan, enabled: false}
        hierarchical: {method: hierarchical, enabled: false}
        type_stratified:
          method: type_stratified
          base_method: binning
          type_col: type_metadata
          n_bins: 20
          bin_method: equal_width
    depends_on: [touch_clustering]
