  # List of directories containing Kinect session config files to scan.
  # Paths are relative to configs/kinect_configs/.
  kinect_configs: [valid_configs_ST13-01, valid_configs_ST13-02, 
      valid_configs_ST13-03, 
      valid_configs_ST14-01_ST14-02/kinect_config_2022-06-15_ST14-01_semicontrolled_block-order01.yaml,
    valid_configs_ST14-01_ST14-02/kinect_config_2022-06-15_ST14-01_semicontrolled_block-order02.yaml,
    valid_configs_ST14-01_ST14-02/kinect_config_2022-06-15_ST14-01_semicontrolled_block-order03.yaml,
    valid_configs_ST14-01_ST14-02/kinect_config_2022-06-15_ST14-01_semicontrolled_block-order05.yaml,
    valid_configs_ST14-01_ST14-02/kinect_config_2022-06-15_ST14-01_semicontrolled_block-order06.yaml,
    valid_configs_ST14-01_ST14-02/kinect_config_2022-06-15_ST14-01_semicontrolled_block-order07.yaml,
    valid_configs_ST14-01_ST14-02/kinect_config_2022-06-15_ST14-01_semicontrolled_block-order08.yaml,
    valid_configs_ST14-01_ST14-02/kinect_config_2022-06-15_ST14-01_semicontrolled_block-order09.yaml,
    valid_configs_ST14-01_ST14-02/kinect_config_2022-06-15_ST14-01_semicontrolled_block-order10.yaml,
    valid_configs_ST14-01_ST14-02/kinect_config_2022-06-15_ST14-02_semicontrolled_block-order01.yaml,
    valid_configs_ST14-01_ST14-02/kinect_config_2022-06-15_ST14-02_semicontrolled_block-order02.yaml,
    valid_configs_ST14-01_ST14-02/kinect_config_2022-06-15_ST14-02_semicontrolled_block-order04.yaml,
    valid_configs_ST14-01_ST14-02/kinect_config_2022-06-15_ST14-02_semicontrolled_block-order05.yaml,
    valid_configs_ST14-01_ST14-02/kinect_config_2022-06-15_ST14-02_semicontrolled_block-order06.yaml,
    valid_configs_ST14-01_ST14-02/kinect_config_2022-06-15_ST14-02_semicontrolled_block-order08.yaml,
    valid_configs_ST14-03_ST14-04, 
      valid_configs_ST15-01_ST15-02/kinect_config_2022-06-16_ST15-01_semicontrolled_block-order03.yaml,
    valid_configs_ST15-01_ST15-02/kinect_config_2022-06-16_ST15-01_semicontrolled_block-order04.yaml,
    valid_configs_ST15-01_ST15-02/kinect_config_2022-06-16_ST15-01_semicontrolled_block-order05.yaml,
    valid_configs_ST15-01_ST15-02/kinect_config_2022-06-16_ST15-01_semicontrolled_block-order06.yaml,
    valid_configs_ST15-01_ST15-02/kinect_config_2022-06-16_ST15-02_semicontrolled_block-order01.yaml,
    valid_configs_ST16-02/kinect_config_2022-06-17_ST16-02_semicontrolled_block-order01.yaml,
    valid_configs_ST16-02/kinect_config_2022-06-17_ST16-02_semicontrolled_block-order02.yaml,
    valid_configs_ST16-02/kinect_config_2022-06-17_ST16-02_semicontrolled_block-order03.yaml,
    valid_configs_ST16-02/kinect_config_2022-06-17_ST16-02_semicontrolled_block-order04.yaml,
    valid_configs_ST16-02/kinect_config_2022-06-17_ST16-02_semicontrolled_block-order05.yaml,
    valid_configs_ST16-02/kinect_config_2022-06-17_ST16-02_semicontrolled_block-order06.yaml,
    valid_configs_ST16-02/kinect_config_2022-06-17_ST16-02_semicontrolled_block-order07.yaml,
    valid_configs_ST16-02/kinect_config_2022-06-17_ST16-02_semicontrolled_block-order08.yaml,
    valid_configs_ST16-02/kinect_config_2022-06-17_ST16-02_semicontrolled_block-order09.yaml,
    valid_configs_ST16-02/kinect_config_2022-06-17_ST16-02_semicontrolled_block-order10.yaml,
    valid_configs_ST16-02/kinect_config_2022-06-17_ST16-02_semicontrolled_block-order11.yaml,
    valid_configs_ST16-02/kinect_config_2022-06-17_ST16-02_semicontrolled_block-order12.yaml,
    valid_configs_ST16-02/kinect_config_2022-06-17_ST16-02_semicontrolled_block-order13.yaml,
    valid_configs_ST16-02/kinect_config_2022-06-17_ST16-02_semicontrolled_block-order14.yaml,
    valid_configs_ST16-02/kinect_config_2022-06-17_ST16-02_semicontrolled_block-order15.yaml,
    valid_configs_ST16-03_ST16-04, valid_configs_ST16-05, valid_configs_ST18-02, 
      valid_configs_ST18-04]

tasks:
  # --- Analysis Tasks ---
  # Step 1: Block/trial structure summary. No dependencies.
  generate_session_summary:
    enabled: true
    options:
      force_processing: true
    depends_on: []

  # Primary processing flow. Must run first.
  process_unified_touches:
    enabled: true
    options:
      force_processing: true
    depends_on: []

  # Consumes output from process_unified_touches
  analyse_number_single_touches:
    enabled: true
    options:
      force_processing: true
    depends_on: ["process_unified_touches"]

  # Consumes output from process_unified_touches
  analyse_ap_efficacy:
    enabled: true
    options:
      force_processing: true
    depends_on: ["process_unified_touches"]

  # RF mapping via selectivity + DBSCAN. Requires unified touch summaries.
  map_receptive_fields:
    enabled: true
    options:
      grouping_columns: ['type_metadata', 'direction']
      monitor: false
      force_processing: true
    depends_on: ["process_unified_touches"]
