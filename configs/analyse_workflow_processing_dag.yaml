# Dependency-aware configuration for the Analysis Workflow — Processing tasks only.
# Specifies input directories and task toggle states for processing (unattended) tasks.
# See analyse_workflow_dag.yaml for the combined reference config.

parameters:
  # List of directories containing Kinect session config files to scan.
  # Paths are relative to configs/kinect_configs/.
  kinect_configs: [valid_configs_ST13-01, valid_configs_ST13-02, 
      valid_configs_ST13-03, valid_configs_ST14-01, valid_configs_ST14-02, 
      valid_configs_ST14-03, valid_configs_ST14-04, valid_configs_ST15-01, 
      valid_configs_ST15-02, valid_configs_ST16-02, valid_configs_ST16-03, 
      valid_configs_ST16-04, valid_configs_ST16-05, valid_configs_ST18-01, 
      valid_configs_ST18-04]

tasks:
  # ============================================================
  # Processing Tasks — produce files, run unattended
  # ============================================================

  # Block/trial structure summary. No dependencies.
  summarize_session_blocks:
    category: processing
    enabled: true
    options:
      force_processing: false
    depends_on: []

  # Simple RF mapping: raw spike-position CSV + forearm heatmap per session.
  # Runs before feature extraction — no dependency on clustering or extraction.
  # Output: 4_analysed/receptive_field_maps_simple/<session_id>/
  map_receptive_fields_simple:
    category: processing
    enabled: true
    options:
      force_processing: false
      # Debugging toggle: when true, opens an interactive matplotlib window mid-run.
      # Must be false for unattended / batch processing.
      show_interactive: false
      projection_method: cylindrical_unwrap
    depends_on: []

  # Stage 1 (Preparation): Per-session block-ID synthesis and NaN-gap interpolation.
  # Produces a cleaned CSV with no NaN gaps in touch columns within each touch group.
  # Output: 4_analysed/preparation/<session>_prepared.csv
  touch_preparation:
    category: processing
    enabled: true
    options:
      force_processing: false
      preparation:
        interpolation:
          method: cubic
    depends_on: []

  # Per-touch RF mapping: accumulate per-vertex neuron values for every single touch.
  # Reads the prepared CSV produced by touch_preparation and saves sparse vertex-value
  # pairs per touch as an .npz file.
  # Output: 4_analysed/single_touch_rf_maps/<session_id>/single_touch_rf_maps.npz
  map_single_touch_rf:
    category: processing
    enabled: true
    options:
      force_processing: false
      neuron_mode: iff
    depends_on: [touch_preparation]

  # Stage 2a (Series Transforms): Per-session kinematics, pressure, and MoS computation.
  # Adds hand_velocity_x/y/z, hand_acceleration_x/y/z, pressure, and (when enabled) MoS
  # columns to each session CSV.
  # Output: 4_analysed/series_transforms/<session>_series_augmented.csv
  touch_series_transforms:
    category: processing
    enabled: true
    options:
      force_processing: false
      transforms:
        hand_position:
          enabled: true
          drop_used_inputs: true
        hand_velocity:
          enabled: true
          drop_used_inputs: false
        hand_acceleration:
          enabled: true
          drop_used_inputs: false
        pressure:
          enabled: true
          drop_used_inputs: false
        mechanics_of_solids:
          enabled: true
          drop_used_inputs: false
          youngs_modulus_kpa: 100.0
          poissons_ratio: 0.45
          skin_thickness_mm: 1.5
        hand_velocity_amplitude:
          enabled: true
          drop_used_inputs: false
        hand_velocity_signed:
          enabled: true
          drop_used_inputs: false
    depends_on: [touch_preparation]

  # Stage 2b (Feature Extraction): Per-session feature extraction. Each enabled feature extracts to its own folder.
  # Output: 4_analysed/touch_features/<feature>/<session>_touch_summary.csv
  touch_feature_extraction:
    category: processing
    enabled: true
    options:
      force_processing: false
      # Each key is an aggregation family. StatisticalExtractor auto-discovers all numeric
      # columns from the series-augmented CSV and applies the requested aggregation.
      features:
        max:
          enabled: true
        mean:
          enabled: true
        min:
          enabled: true
        median:
          enabled: true
        std:
          enabled: true
        range:
          enabled: true
        skewness:
          enabled: true
        # Mean of numeric columns over frames where Nerve_freq > 0 (fallback: contact_detected == 1)
        mean_during_iff:
          enabled: true
        # Mean of numeric columns over the window before the first IFF-active frame
        mean_before_iff:
          enabled: true
          pre_iff_window_ms: 250
    depends_on: [touch_series_transforms]

  # Population RF grid: sweep N-D feature space, average single-touch RFs per cell.
  # Depends on: map_single_touch_rf (RF maps), touch_feature_extraction (feature CSVs).
  # Output: 4_analysed/population_rf_grid/<session_id>/
  map_population_rf_grid:
    category: processing
    enabled: true
    options:
      force_processing: false
      neuron_mode: iff
      per_gesture_type: true
      vertex_threshold_ratio: 0.25
      compute_baseline: true
      features:
        hand_velocity_amplitude_mean_during_iff:
          min: 0
          max: 500
          step: 5
          span: 10
        pressure_mean_during_iff:
          min: 0.002
          max: 0.22
          step: 0.02
          span: 0.04
    depends_on: [map_single_touch_rf, touch_feature_extraction]

  # Reduces per-gesture-type population RF grid NPZ files to scalar metric CSVs.
  # Output: 4_analysed/population_rf_grid_metrics/<session_id>/
  reduce_population_rf_grid:
    category: processing
    enabled: true
    options:
      force_processing: false
      projection_method: tangent_plane
    depends_on: [map_population_rf_grid]

  # Renders per-IFF-metric heatmap PNGs from population RF grid metrics CSVs.
  # Output: 4_analysed/population_rf_grid_metrics_heatmaps/<metric>/
  visualize_population_rf_grid_metrics:
    category: processing
    enabled: true
    options:
      force_processing: true
      extracted_features:
      - touch_count
      - max_iff
      - mean_iff
      - median_iff
      - std_iff
      - iff_range
      - n_active_vertices
      - hypsometric_integral
      - coefficient_of_variation
      - iff_skewness
      - iff_kurtosis
      - gini_coefficient
      - shannon_entropy
      - perimeter_mm
      - circularity
      - eccentricity
      - hotspot_area_mm2
      - threshold_area_mm2
      - convex_hull_area_mm2
    depends_on: [reduce_population_rf_grid]

  # Stages 3–5 (Reduction + Clustering + Evaluation): Global clustering on pooled feature CSVs.
  # Each cluster_group defines which data types / aggregations to use and its own clustering_methods.
  # Output: 4_analysed/touch_clusters/<group_name>/<clusterer>/
  touch_clustering:
    category: processing
    enabled: false
    options:
      force_processing: false
      cluster_groups:
        kinematics_simple_mean:
          enabled: false
          features:
            contact_depth: [mean]
            contact_area: [mean]
            hand_velocity: [mean]
            location: [mean]
          clustering_methods:
            binning:
              method: binning
              n_bins: 20
              bin_method: equal_width
              enabled: true
            type_stratified:
              method: type_stratified
              base_method: binning
              n_bins: 20
              bin_method: equal_width
              enabled: true
            cartesian_binning:
              method: cartesian_binning
              n_bins: 5
              n_bins_per_feature: {}
              bin_method: equal_width
              enabled: false
        kinematics_max:
          enabled: false
          features:
            contact_depth: [max]
            contact_area: [max]
            hand_velocity: [max]
            hand_acceleration: [max]
          clustering_methods:
            binning:
              method: binning
              n_bins: 20
              bin_method: equal_width
              enabled: true
        pressure_velocity_mean:
          enabled: false
          features:
            hand_velocity:
            - mean
            pressure:
            - mean
          visualization:
            x_feature: pressure_mean
            y_feature: hand_velocity_y_mean
          clustering_methods:
            binning:
              method: binning
              n_bins: 20
              bin_method: equal_width
              enabled: false
            kmeans:
              method: kmeans
              n_clusters: 8
              enabled: false
            dbscan:
              method: dbscan
              eps: 0.5
              min_samples: 5
              enabled: false
            hierarchical:
              method: hierarchical
              n_clusters: 8
              linkage: ward
              enabled: false
            type_stratified:
              method: type_stratified
              base_method: binning
              n_bins: 20
              bin_method: equal_width
              enabled: false
            gmm:
              method: gmm
              max_components: 15
              covariance_type: full
              n_init: 10
              min_touches_per_component: 30
        kinematics_with_category:
          enabled: false
          features:
            contact_depth: [mean]
            contact_area: [mean]
            hand_velocity: [mean]
            hand_acceleration: [mean]
            location: [mean]
          clustering_methods:
            binning:
              method: binning
              n_bins: 20
              bin_method: equal_width
              enabled: true
        all_touch_features_mean:
          enabled: false
          features:
            contact_depth: [mean]
            contact_area: [mean]
            hand_velocity: [mean]
            hand_acceleration: [mean]
            pressure: [mean]
            hand_position: [mean]
            mechanics_of_solids: [mean]
            location: [mean]
          clustering_methods:
            binning:
              method: binning
              n_bins: 20
              bin_method: equal_width
              enabled: true
            type_stratified:
              method: type_stratified
              base_method: binning
              n_bins: 20
              bin_method: equal_width
              enabled: true
        pressure_velocity_mean_cartesian_binning:
          enabled: true
          per_type_clustering: true
          features:
            hand_velocity_amplitude:
            - mean
            pressure:
            - mean
          clustering_methods:
            binning:
              method: binning
              n_bins: 20
              bin_method: equal_width
              enabled: false
            kmeans:
              method: kmeans
              n_clusters: 8
              enabled: false
            dbscan:
              method: dbscan
              eps: 0.5
              min_samples: 5
              enabled: false
            hierarchical:
              method: hierarchical
              n_clusters: 8
              linkage: ward
              enabled: false
            type_stratified:
              method: type_stratified
              enabled: false
            gmm:
              method: gmm
              max_components: 15
              covariance_type: full
              n_init: 10
              min_touches_per_component: 30
              enabled: false
            cartesian_binning:
              method: cartesian_binning
              n_bins: 7
              bin_method: equal_frequency
              outlier_method: iqr
      reduction:
        scaler: standard
        variance_filter:
        decomposition:
      evaluation:
        internal_metrics: [silhouette, davies_bouldin, calinski_harabasz]
        stability:
          method: bootstrap
          n_rounds: 20
          subsample_fraction: 0.8
          score: adjusted_rand_index
    depends_on: [touch_feature_extraction]

  # Post-pipeline analysis: Statistical comparison of sensor measurements across strata.
  # Discovers clustered CSVs on disk — references cluster_groups by name from touch_clustering.
  # Output: 4_analysed/touch_comparisons/<group_name>/<clusterer>/
  touch_comparing:
    category: processing
    enabled: false
    options:
      force_processing: false
      cluster_groups: [pressure_velocity_mean_cartesian_binning]
      comparing_profiles:
        bias:
          method: bias
          measurement_col: spike_elicited
          sensor_col: session_id
          alpha: 0.05
        precision:
          method: precision
          measurement_col: spike_elicited
          sensor_col: session_id
        distribution:
          method: distribution
          measurement_col: spike_elicited
          sensor_col: session_id
      min_instances_per_sensor: 5
      min_sensor_types: 2
    depends_on: [touch_clustering]

  # Consumes output from touch_feature_extraction
  analyse_ap_efficacy:
    category: processing
    enabled: false
    options:
      force_processing: false
    depends_on: [touch_feature_extraction]

  # Step 1 of split pipeline: CSV parsing, spike counting, artifact writing.
  # Idempotent against clustered CSV mtime; does not re-run on vis-param changes.
  extract_receptive_fields_clustered:
    category: processing
    enabled: false
    options:
      force_processing: false
      cluster_groups: [pressure_velocity_mean_cartesian_binning]
    depends_on: [touch_clustering]

  # Step 2 of split pipeline: RF metrics, 2D heatmap rendering.
  # Re-runs only when projection_method / disjoint_mask_distance_mm change or force=true.
  visualize_receptive_fields_clustered:
    category: processing
    enabled: false
    options:
      force_processing: false
      cluster_groups: [pressure_velocity_mean_cartesian_binning]
      projection_method: cylindrical_unwrap
      disjoint_mask_distance_mm: 8.0
      gallery_viewer: false
      # enabled: true → face-on tangent-plane camera computed automatically.
      # enabled: false → skip camera assignment.
      camera_angle_mode:
        enabled: false
    depends_on: [extract_receptive_fields_clustered]

  # ============================================================
  # Legacy / Deprecated
  # ============================================================

  # DEPRECATED: Cluster-based RF mapping (monolithic). Calls extraction then visualization in
  # one step and may launch a blocking GUI. Use extract_receptive_fields_clustered +
  # visualize_receptive_fields_clustered instead.
  # Output: 4_analysed/receptive_field_maps_clustered/<combination>/<clusterer>/
  map_receptive_fields_clustered:
    category: processing
    enabled: false
    options:
      force_processing: false
      camera_angle_mode:
        enabled: true
      cluster_groups: [kinematics_simple_mean, pressure_velocity_mean]
      projection_method: cylindrical_unwrap
      disjoint_mask_distance_mm: 8.0
    depends_on: [touch_clustering]
