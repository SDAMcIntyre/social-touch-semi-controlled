# Dependency-aware configuration for the Analysis Workflow — Processing tasks only.
# Specifies input directories and task toggle states for processing (unattended) tasks.
# See analyse_workflow_dag.yaml for the combined reference config.

parameters:
  # List of directories containing Kinect session config files to scan.
  # Paths are relative to configs/kinect_configs/.
  kinect_configs: [valid_configs_ST13-01, valid_configs_ST13-02,
      valid_configs_ST13-03, valid_configs_ST14-01, valid_configs_ST14-02,
      valid_configs_ST14-04, valid_configs_ST15-01, valid_configs_ST16-02,
      valid_configs_ST16-03, valid_configs_ST16-05, valid_configs_ST18-01,
      valid_configs_ST18-04]

tasks:
  # ============================================================
  # Processing Tasks — produce files, run unattended
  # ============================================================

  # Block/trial structure summary. No dependencies.
  touch_summarize_blocks:
    category: foundation
    enabled: true
    options:
      force_processing: false
    depends_on: []

  # Stage 1 (Preparation): Per-session block-ID synthesis and NaN-gap interpolation.
  # Produces a cleaned CSV with no NaN gaps in touch columns within each touch group.
  # Output: 4_analysed/preparation/<session>_prepared.csv
  touch_prepare_sessions:
    category: foundation
    enabled: true
    options:
      force_processing: false
      preparation:
        interpolation:
          method: cubic
    depends_on: []

  # Per-touch RF mapping: accumulate per-vertex neuron values for every single touch.
  # Reads the prepared CSV produced by touch_prepare_sessions and saves sparse vertex-value
  # pairs per touch as an .npz file.
  # Output: 4_analysed/single_touch_rf_maps/<session_id>/single_touch_rf_maps.npz
  spatial_map_single_touch:
    category: spatial_sensitivity
    enabled: true
    options:
      force_processing: false
      neuron_mode: iff
    depends_on: [touch_prepare_sessions]

  # Stage 2a (Series Transforms): Per-session kinematics, pressure, and MoS computation.
  # Adds hand_velocity_x/y/z, hand_acceleration_x/y/z, pressure, and (when enabled) MoS
  # columns to each session CSV.
  # Output: 4_analysed/series_transforms/<session>_series_augmented.csv
  touch_compute_series:
    category: foundation
    enabled: true
    options:
      force_processing: false
      transforms:
        hand_position:
          enabled: true
          drop_used_inputs: true
        hand_velocity:
          enabled: true
          drop_used_inputs: false
        hand_acceleration:
          enabled: true
          drop_used_inputs: false
        pressure:
          enabled: true
          drop_used_inputs: false
        mechanics_of_solids:
          enabled: true
          drop_used_inputs: false
          youngs_modulus_kpa: 100.0
          poissons_ratio: 0.45
          skin_thickness_mm: 1.5
        hand_velocity_amplitude:
          enabled: true
          drop_used_inputs: false
        hand_velocity_signed:
          enabled: true
          drop_used_inputs: false
    depends_on: [touch_prepare_sessions]

  # RF Camera Settings: interactively set camera orientation per session.
  # Required before running cross_render_cluster_rf,
  # cross_extract_grid_metrics, and any other downstream RF projection task.
  # Saves to 4_analysed/rf_camera_settings/rf_camera_settings.json.
  # Output: interactive GUI + rf_camera_settings.json
  spatial_set_camera:
    category: viewer_required
    enabled: true
    options:
      force_processing: false
    depends_on: [touch_compute_series]

  # Simple RF mapping: raw spike-position CSV + forearm heatmap per session.
  # No dependency on clustering or extraction, but requires camera settings
  # for rendering (load_rf_camera_rotation raises if absent).
  # Output: 4_analysed/receptive_field_maps_simple/<session_id>/
  spatial_map_baseline:
    category: spatial_sensitivity
    enabled: true
    options:
      force_processing: false
      # Debugging toggle: when true, opens an interactive matplotlib window mid-run.
      # Must be false for unattended / batch processing.
      show_interactive: false
      projection_method: cylindrical_unwrap
    depends_on: [spatial_set_camera]

  # Per-session SLIM UV config GUI: opens an interactive PyQt5/PyVista viewer
  # per session that lets the researcher pick mesh_method, clean_steps,
  # n_iter, and max_edge_mm, preview the result, and save a per-session
  # slim_uv_config.yaml consumed by spatial_precompute_slim_uv below.
  # Saves to 4_analysed/forearm_slim_uv/<session_id>/slim_uv_config.yaml.
  spatial_configure_slim_uv:
    category: viewer_required
    enabled: true
    options:
      # When false (default), sessions that already have slim_uv_config.yaml
      # are skipped; the GUI only opens for sessions missing a config.
      # Set true to re-open the GUI for every session.
      force_processing: false
      # DAG-level defaults applied to sessions that have no per-session YAML.
      mesh_method: bpa
      max_edge_mm: 0.0  # 0.0 means auto (3.0 × mean nearest-neighbour distance)
      n_iter: 40
      save_diagnostics: true
      clean_steps:
        remove_non_manifold: true
        repair_pinch_vertices: true
        remove_slivers: true
        stitch_boundary_gaps: true
        fill_interior_holes: true
    depends_on: [spatial_map_single_touch]

  # Precompute SLIM UV map per session. Caches the UV next to the forearm PLY.
  # Requires spatial_map_single_touch output (single_touch_rf_maps.npz) to compute the
  # IFF-weighted centroid used as the UV origin (center_vid).
  # Enable when using projection_method: slim in downstream RF tasks.
  spatial_precompute_slim_uv:
    category: spatial_sensitivity
    enabled: true
    options:
      force_processing: false
      n_iter: 40
      save_diagnostics: true
      # When true, open a step-by-step PyQt5/PyVista viewer per session
      # after the SLIM precompute. Useful for diagnosing stitching/cleaning
      # issues. Blocks the pipeline until the window is closed.
      interactive: false
      # Toggle individual mesh cleaning steps (all default to true).
      # Steps 1-3 (largest component, fix winding, remove orphans) always run.
      clean_steps:
        remove_non_manifold: true
        repair_pinch_vertices: false
        remove_slivers: false
        stitch_boundary_gaps: false
        fill_interior_holes: true
      # Mesh construction method: "bpa" (Ball Pivoting Algorithm, default) or
      # "delaunay" (2.5D Delaunay triangulation — manifold, no non-manifold cleanup needed).
      # Switching this value triggers automatic recompute (staleness detection).
      mesh_method: delaunay
      # Maximum edge length in mm for Delaunay mesh filtering (delaunay only).
      # When absent, defaults to 3.0 × mean nearest-neighbour distance (auto).
      # max_edge_mm: 12.0
    depends_on:
    - spatial_map_single_touch
    - spatial_configure_slim_uv

  # Render per-session 2D population RF heatmap PNGs projected via SLIM UV.
  # Produces one PNG per gesture subset (all, tap, stroke_proximal, stroke_distal)
  # with a session-wide consistent colour scale.
  # Output: 4_analysed/population_response_fields/<session_id>/
  spatial_extract_boundaries:
    category: spatial_sensitivity
    enabled: true
    options:
      force_processing: true
      neuron_mode: iff
      min_overlap_pct: 25
      median_filter_size: 5
      inflection_sigma: 5.0
      heatmap_space: linear
      cmap: jet
    depends_on: [spatial_map_single_touch, spatial_precompute_slim_uv]

  # Aggregate inflection boundary metrics across sessions and render comparison visuals.
  # Reads per-session NPZ files from spatial_extract_boundaries.
  # Produces: session_rf_boundary_summary.csv, contour overlay PNGs, metric panel PNGs,
  # session-x-gesture heatmap PNGs under 4_analysed/session_rf_boundary_comparison/
  spatial_compare_boundaries:
    category: spatial_sensitivity
    enabled: true
    options:
      force_processing: false
    depends_on: [spatial_extract_boundaries]

  # Compare RF center positions between proximal and distal strokes per session.
  # Reads per-session NPZ files from spatial_extract_boundaries.
  # Produces per-session center-marked heatmap PNGs, aggregate PNG, and summary CSV.
  # Output: 4_analysed/rf_center_proximal_distal/
  spatial_compare_rf_centers:
    category: spatial_sensitivity
    enabled: true
    options:
      force_processing: true
      heatmap_space: linear
      cmap: jet
    depends_on: [spatial_extract_boundaries]

  # Stage 2b (Feature Extraction): Per-session feature extraction. Each enabled feature extracts to its own folder.
  # Output: 4_analysed/touch_features/<feature>/<session>_touch_summary.csv
  stimulus_extract_features:
    category: stimulus_sensitivity
    enabled: true
    options:
      force_processing: false
      # Each key is an aggregation family. StatisticalExtractor auto-discovers all numeric
      # columns from the series-augmented CSV and applies the requested aggregation.
      features:
        max:
          enabled: true
        mean:
          enabled: true
        min:
          enabled: true
        median:
          enabled: true
        std:
          enabled: true
        range:
          enabled: true
        skewness:
          enabled: true
        # Mean of numeric columns over frames where Nerve_freq > 0 (fallback: contact_detected == 1)
        mean_during_iff:
          enabled: true
        # Mean of numeric columns over the window before the first IFF-active frame
        mean_before_iff:
          enabled: true
          pre_iff_window_ms: 250
    depends_on: [touch_compute_series]

  stimulus_render_radar:
    category: stimulus_sensitivity
    enabled: false
    options:
      force_processing: false
      radar_groups:
        canonical_iff:
          enabled: true
          features:
            contact_area:
            - mean_during_iff
            contact_depth:
            - mean_during_iff
            hand_velocity_amplitude:
            - mean_during_iff
    depends_on: [stimulus_extract_features]

  # Population RF grid: sweep N-D feature space, average single-touch RFs per cell.
  # Depends on: spatial_map_single_touch (RF maps), stimulus_extract_features (feature CSVs).
  # Output: 4_analysed/population_rf_grid/<session_id>/
  cross_map_feature_grid:
    category: cross_domain
    enabled: false
    options:
      force_processing: false
      grid_groups:
        velocity_pressure_2d:
          enabled: false
          neuron_mode: iff
          per_gesture_type: true
          vertex_threshold_ratio: 0.25
          compute_baseline: true
          features:
            hand_velocity_amplitude_mean_during_iff:
              min: 0
              max: 500
              step: 5
              span: 10
            pressure_mean_during_iff:
              min: 0.002
              max: 0.22
              step: 0.02
              span: 0.04
        velocity_depth_2d:
          enabled: true
          neuron_mode: iff
          per_gesture_type: true
          vertex_threshold_ratio: 0.25
          compute_baseline: true
          features:
            contact_depth_mean: {min: 0.0, max: 10.0, step: 0.1, span: 0.2}
            hand_velocity_amplitude_mean: {min: 0.0, max: 500.0, step: 5.0, span:
                10.0}
    depends_on: [spatial_map_single_touch, stimulus_extract_features]

  # Reduces per-gesture-type population RF grid NPZ files to scalar metric CSVs.
  # Output: 4_analysed/population_rf_grid_metrics/<session_id>/
  cross_extract_grid_metrics:
    category: cross_domain
    enabled: false
    options:
      force_processing: false
      projection_method: tangent_plane
    depends_on: [cross_map_feature_grid, spatial_set_camera]

  # Renders per-IFF-metric heatmap PNGs from population RF grid metrics CSVs.
  # Output: 4_analysed/population_rf_grid_metrics_heatmaps/<metric>/
  cross_render_grid_metrics:
    category: cross_domain
    enabled: true
    options:
      force_processing: false
      extracted_features:
      - touch_count
      - mean_iff
      - perimeter_mm
      - hotspot_area_mm2
      - threshold_area_mm2
      - convex_hull_area_mm2
    depends_on: [cross_extract_grid_metrics]

  # Cross-session comparison heatmap: 1D population RF grid + per-gesture heatmap PNGs.
  # Renders one PNG per gesture type with sessions on Y-axis, velocity bins on X-axis,
  # and color encoding a configurable RF metric (default: mean_iff).
  # Output: 4_analysed/session_comparison/session_comparison_heatmaps/<metric>/
  cross_render_sessions:
    category: cross_domain
    enabled: true
    options:
      force_processing: true
      neuron_mode: iff
      vertex_threshold_ratio: 0.25
      metric_name: mean_iff
      projection_method: tangent_plane
      features:
        hand_velocity_amplitude_mean_during_iff:
          min: 0
          max: 500
          step: 25
          span: 50
    depends_on: [spatial_map_single_touch, stimulus_extract_features,
        spatial_set_camera]

  # Stages 3–5 (Reduction + Clustering + Evaluation): Global clustering on pooled feature CSVs.
  # Each cluster_group defines which data types / aggregations to use and its own clustering_methods.
  # Output: 4_analysed/touch_clusters/<group_name>/<clusterer>/
  stimulus_cluster_touches:
    category: stimulus_sensitivity
    enabled: false
    options:
      force_processing: false
      cluster_groups:
        kinematics_simple_mean:
          enabled: false
          features:
            contact_depth: [mean]
            contact_area: [mean]
            hand_velocity: [mean]
            location: [mean]
          clustering_methods:
            binning:
              method: binning
              n_bins: 20
              bin_method: equal_width
              enabled: true
            type_stratified:
              method: type_stratified
              base_method: binning
              n_bins: 20
              bin_method: equal_width
              enabled: true
            cartesian_binning:
              method: cartesian_binning
              n_bins: 5
              n_bins_per_feature: {}
              bin_method: equal_width
              enabled: false
        kinematics_max:
          enabled: false
          features:
            contact_depth: [max]
            contact_area: [max]
            hand_velocity: [max]
            hand_acceleration: [max]
          clustering_methods:
            binning:
              method: binning
              n_bins: 20
              bin_method: equal_width
              enabled: true
        pressure_velocity_mean:
          enabled: false
          features:
            hand_velocity:
            - mean
            pressure:
            - mean
          visualization:
            x_feature: pressure_mean
            y_feature: hand_velocity_y_mean
          clustering_methods:
            binning:
              method: binning
              n_bins: 20
              bin_method: equal_width
              enabled: false
            kmeans:
              method: kmeans
              n_clusters: 8
              enabled: false
            dbscan:
              method: dbscan
              eps: 0.5
              min_samples: 5
              enabled: false
            hierarchical:
              method: hierarchical
              n_clusters: 8
              linkage: ward
              enabled: false
            type_stratified:
              method: type_stratified
              base_method: binning
              n_bins: 20
              bin_method: equal_width
              enabled: false
            gmm:
              method: gmm
              max_components: 15
              covariance_type: full
              n_init: 10
              min_touches_per_component: 30
        kinematics_with_category:
          enabled: false
          features:
            contact_depth: [mean]
            contact_area: [mean]
            hand_velocity: [mean]
            hand_acceleration: [mean]
            location: [mean]
          clustering_methods:
            binning:
              method: binning
              n_bins: 20
              bin_method: equal_width
              enabled: true
        all_touch_features_mean:
          enabled: false
          features:
            contact_depth: [mean]
            contact_area: [mean]
            hand_velocity: [mean]
            hand_acceleration: [mean]
            pressure: [mean]
            hand_position: [mean]
            mechanics_of_solids: [mean]
            location: [mean]
          clustering_methods:
            binning:
              method: binning
              n_bins: 20
              bin_method: equal_width
              enabled: true
            type_stratified:
              method: type_stratified
              base_method: binning
              n_bins: 20
              bin_method: equal_width
              enabled: true
        pressure_velocity_mean_cartesian_binning:
          enabled: true
          per_type_clustering: true
          features:
            hand_velocity_amplitude:
            - mean
            pressure:
            - mean
          clustering_methods:
            binning:
              method: binning
              n_bins: 20
              bin_method: equal_width
              enabled: false
            kmeans:
              method: kmeans
              n_clusters: 8
              enabled: false
            dbscan:
              method: dbscan
              eps: 0.5
              min_samples: 5
              enabled: false
            hierarchical:
              method: hierarchical
              n_clusters: 8
              linkage: ward
              enabled: false
            type_stratified:
              method: type_stratified
              enabled: false
            gmm:
              method: gmm
              max_components: 15
              covariance_type: full
              n_init: 10
              min_touches_per_component: 30
              enabled: false
            cartesian_binning:
              method: cartesian_binning
              n_bins: 7
              bin_method: equal_frequency
              outlier_method: iqr
      reduction:
        scaler: standard
        variance_filter:
        decomposition:
      evaluation:
        internal_metrics: [silhouette, davies_bouldin, calinski_harabasz]
        stability:
          method: bootstrap
          n_rounds: 20
          subsample_fraction: 0.8
          score: adjusted_rand_index
    depends_on: [stimulus_extract_features]

  # Post-pipeline analysis: Statistical comparison of sensor measurements across strata.
  # Discovers clustered CSVs on disk — references cluster_groups by name from stimulus_cluster_touches.
  # Output: 4_analysed/touch_comparisons/<group_name>/<clusterer>/
  stimulus_compare_clusters:
    category: stimulus_sensitivity
    enabled: false
    options:
      force_processing: false
      cluster_groups: [pressure_velocity_mean_cartesian_binning]
      comparing_profiles:
        bias:
          method: bias
          measurement_col: spike_elicited
          sensor_col: session_id
          alpha: 0.05
        precision:
          method: precision
          measurement_col: spike_elicited
          sensor_col: session_id
        distribution:
          method: distribution
          measurement_col: spike_elicited
          sensor_col: session_id
      min_instances_per_sensor: 5
      min_sensor_types: 2
    depends_on: [stimulus_cluster_touches]

  # Consumes output from stimulus_extract_features
  stimulus_analyse_efficacy:
    category: stimulus_sensitivity
    enabled: false
    options:
      force_processing: false
    depends_on: [stimulus_extract_features]

  # Step 1 of split pipeline: CSV parsing, spike counting, artifact writing.
  # Idempotent against clustered CSV mtime; does not re-run on vis-param changes.
  cross_extract_cluster_rf:
    category: cross_domain
    enabled: false
    options:
      force_processing: false
      cluster_groups: [pressure_velocity_mean_cartesian_binning]
    depends_on: [stimulus_cluster_touches]

  # Step 2a of split pipeline: RF metrics computation (centroid, hull area, Gaussian fit).
  # Re-runs only when projection_method changes or force=true. Independent of rendering params.
  cross_compute_cluster_metrics:
    category: cross_domain
    enabled: false
    options:
      force_processing: false
      cluster_groups: [pressure_velocity_mean_cartesian_binning]
      projection_method: cylindrical_unwrap
    depends_on: [cross_extract_cluster_rf, spatial_set_camera]

  # Step 2b of split pipeline: 2D heatmap rendering.
  # Re-runs only when disjoint_mask_distance_mm changes or force=true. Independent of metrics params.
  cross_render_cluster_rf:
    category: cross_domain
    enabled: false
    options:
      force_processing: false
      cluster_groups: [pressure_velocity_mean_cartesian_binning]
      projection_method: cylindrical_unwrap
      disjoint_mask_distance_mm: 8.0
      gallery_viewer: false
      # enabled: true → face-on tangent-plane camera computed automatically.
      # enabled: false → skip camera assignment.
      camera_angle_mode:
        enabled: false
    depends_on: [cross_extract_cluster_rf, spatial_set_camera]
