# A dependency-aware configuration representing a task graph (DAG) for Postprocessing.
# 'depends_on' specifies which tasks must be completed before this one can run.
# Set 'enabled: false' to skip a task and all tasks that depend on it.
# UPDATED: Task keys now correspond directly to Python function names.

parameters:
  # Set to true to run different sessions in parallel, false to run them one by one.
  parallel_execution: false
  kinect_configs: valid_configs_ST13-03

tasks:

  # --- Spatial Transform Pipeline ---
  # Step 0: ICP Registration — aligns all blocks into a common coordinate frame.
  # Input: blocks_merged/ CSVs
  # Output: blocks_registered/
  apply_icp_registration:
    enabled: true
    options:
      force_processing: true
    depends_on: []

  # Step 1: Deduplicate (x,y) in forearm PLYs and contact_points CSVs.
  # Removes layered Kinect depth points at the same (x,y) keeping lowest z.
  deduplicate_xy:
    enabled: true
    options:
      force_processing: true
      monitor: false
      epsilon: 15.0
    depends_on: [apply_icp_registration]

  # Step 2: Project contact points onto the deduplicated forearm surface.
  # Contact points are snapped to the forearm so every subsequent rigid transform
  # (PCA) preserves on-surface membership.
  project_contacts_onto_forearm:
    enabled: true
    options:
      force_processing: true
    depends_on: [deduplicate_xy]

  set_xyz_reference_from_gestures:
    enabled: true
    options:
      force_processing: true
    depends_on: [project_contacts_onto_forearm]

  export_forearm_pca_calibrated:
    enabled: true
    options:
      force_processing: true
    depends_on: [set_xyz_reference_from_gestures]

  # Contact points are already on-surface after step 1; no late-stage projection needed.
  center_on_receptive_field:
    enabled: true
    options:
      force_processing: true
    depends_on: [export_forearm_pca_calibrated]

  aggregate_session:
    enabled: true
    options:
      force_processing: true
    depends_on: [center_on_receptive_field]
