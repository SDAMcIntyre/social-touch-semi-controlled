# ==============================================================================
# MANUAL PROCESSING PIPELINE CONFIGURATION
# ==============================================================================
# Logic:
#   - Set 'enabled: true' to activate a task.
#   - 'depends_on' defines the DAG execution order.
# ==============================================================================
# ==============================================================================
# VISUALIZATION PIPELINE CONFIGURATION
# ==============================================================================

parameters:
  kinect_configs: [valid_configs_ST15-01, valid_configs_ST16-02, 
      valid_configs_ST16-03, valid_configs_ST16-05, valid_configs_ST18-01, 
      valid_configs_ST18-04]

tasks:
  # PHASE 3: VISUALIZATION & VERIFICATION
  view_ellipse_tracking:
    enabled: false
    description: "Manually view the ellipses fit of the stickers on the hand."
    depends_on: []

  view_ellipse_tracking_adjusted:
    enabled: false
    description: "Manually view the adjusted ellipses fit."
    depends_on: []

  view_consolidated_2d_tracking_data:
    enabled: false
    description: "Manually view the XY estimation of the stickers on the hand."
    depends_on: []

  view_xyz_stickers:
    enabled: false
    description: "Manually view the XYZ estimation of the stickers on the hand."
    depends_on: []

  view_xyz_depth_aggregation:
    enabled: false
    description: "Interactively inspect the depth-weighted XYZ aggregation pipeline
      (mask, samples, depth histogram, weights, weighted-vs-plain scatter)."
    depends_on: []

  # PHASE 4: COMPLEX ASSESSMENTS
  view_somatosensory_assessement:
    enabled: true
    description: "Manually view the somatosensory assessment results."
    depends_on: []

  view_hand_model_overlay:
    enabled: false
    description: "Open a GUI to select a session/block and export an MP4 with the
      MANO hand mesh overlaid on the RGB video."
    depends_on: []
