# ==============================================================================
# VIEW MERGED NEURAL-KINECT — DAG CONFIGURATION
# ==============================================================================
# Drives view_merged_neural_kinect.py.
# Point kinect_configs at the block configs for the session to view.
# ==============================================================================

parameters:
  kinect_configs: [valid_configs_ST13-01, valid_configs_ST13-02, 
      valid_configs_ST13-03, valid_configs_ST14-01, valid_configs_ST14-02, 
      valid_configs_ST14-04, valid_configs_ST16-02, valid_configs_ST16-03, 
      valid_configs_ST16-05, valid_configs_ST18-01, valid_configs_ST18-04]
tasks:
  view_neural_kinect_scene:
    enabled: true
    description: "Launch the NeuralKinectViewer for the merged neural + Kinect 3D
      scene."
    options:
      crop_half_size_mm: 400.0   # AABB half-size in mm around the contact centroid
    depends_on: []

  view_neural_kinect_scene_transformed:
    enabled: false
    description: "Launch the NeuralKinectViewer in registered-frame mode.  Shows the
      unified forearm PLY and applies the per-block ICP transform to the MKV cloud,
      hand mesh, and stickers.  Skipped automatically for single-forearm sessions
      or when registration artifacts are missing."
    options:
      crop_half_size_mm: 400.0   # AABB half-size in mm around the contact centroid
    depends_on: []
