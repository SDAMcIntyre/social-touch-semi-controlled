# ==============================================================================
# VIEW MERGED NEURAL-KINECT — DAG CONFIGURATION
# ==============================================================================
# Drives view_merged_neural_kinect.py.
# Point kinect_configs at the block configs for the session to view.
# ==============================================================================

parameters:
  kinect_configs: [
      valid_configs_ST13-02/kinect_config_2022-06-14_ST13-02_semicontrolled_block-order03.yaml,
    valid_configs_ST13-02/kinect_config_2022-06-14_ST13-02_semicontrolled_block-order04.yaml,
    valid_configs_ST13-02/kinect_config_2022-06-14_ST13-02_semicontrolled_block-order05.yaml,
    valid_configs_ST13-02/kinect_config_2022-06-14_ST13-02_semicontrolled_block-order06.yaml,
    valid_configs_ST13-02/kinect_config_2022-06-14_ST13-02_semicontrolled_block-order07.yaml,
    valid_configs_ST13-02/kinect_config_2022-06-14_ST13-02_semicontrolled_block-order08.yaml]
tasks:
  view_neural_kinect_scene:
    enabled: false
    description: "Launch the NeuralKinectViewer for the merged neural + Kinect 3D
      scene."
    options:
      crop_half_size_mm: 400.0   # AABB half-size in mm around the contact centroid
    depends_on: []

  view_neural_kinect_scene_transformed:
    enabled: true
    description: "Launch the NeuralKinectViewer in registered-frame mode.  Shows the
      unified forearm PLY and applies the per-block ICP transform to the MKV cloud,
      hand mesh, and stickers.  Skipped automatically for single-forearm sessions
      or when registration artifacts are missing."
    options:
      crop_half_size_mm: 400.0   # AABB half-size in mm around the contact centroid
    depends_on: []
