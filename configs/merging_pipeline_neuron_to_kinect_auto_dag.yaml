# A dependency-aware configuration representing a task graph (DAG).
# 'depends_on' specifies which tasks must be completed before this one can run.
# Set 'enabled: false' to skip a task and all tasks that depend on it.

parameters:
  # Set to true to run different sessions in parallel, false to run them one by one.
  parallel_execution: false
  kinect_configs: [valid_configs_ST13-01, valid_configs_ST13-02, 
      valid_configs_ST13-03, valid_configs_ST14-01_ST14-02, 
      valid_configs_ST14-03_ST14-04, valid_configs_ST15-01_ST15-02, 
      valid_configs_ST16-02, valid_configs_ST16-03_ST16-04, 
      valid_configs_ST16-05, 
      valid_configs_ST18-02_ST18-04/kinect_config_2022-06-22_ST18-04_semicontrolled_block-order01.yaml,
    valid_configs_ST18-02_ST18-04/kinect_config_2022-06-22_ST18-04_semicontrolled_block-order02.yaml,
    valid_configs_ST18-02_ST18-04/kinect_config_2022-06-22_ST18-04_semicontrolled_block-order03.yaml,
    valid_configs_ST18-02_ST18-04/kinect_config_2022-06-22_ST18-04_semicontrolled_block-order05.yaml,
    valid_configs_ST18-02_ST18-04/kinect_config_2022-06-22_ST18-04_semicontrolled_block-order06.yaml,
    valid_configs_ST18-02_ST18-04/kinect_config_2022-06-22_ST18-04_semicontrolled_block-order07.yaml,
    valid_configs_ST18-02_ST18-04/kinect_config_2022-06-22_ST18-04_semicontrolled_block-order08.yaml]
  # Path to the experimenter-maintained xlsx file that annotates unusable trials.
  # Relative paths are resolved from the project data root.
  neural_quality_xlsx: "F:/liu-onedrive-nospecial-carac/_Teams/Social touch Kinect
    MNG/03_metadata/semicontrolled_data-collection_quality-check.xlsx"

tasks:
  # --- Stage 5: Final data integration ---
  unify_dataset:
    enabled: true
    options:
      force_processing: false
    # This task depends on outputs from two different branches of the graph
    depends_on: []

  filter_by_neural_quality:
    enabled: true
    options:
      force_processing: false
    depends_on: [unify_dataset]
