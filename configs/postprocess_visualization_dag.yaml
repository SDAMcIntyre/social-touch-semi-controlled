# ==============================================================================
# POSTPROCESSED VISUALIZATION — DAG CONFIGURATION
# ==============================================================================
# Drives postprocess_visualization.py.
# Point kinect_configs at the block configs for the session to view.
#
# Session-level tasks (run once for all sessions):
#   view_forearm_stage_inspector — 3D viewer: navigate sessions/stages via dropdown
#
# Per-block tasks (enable exactly one at a time):
#   view_postprocessed_simple   — forearm PLY + contact points + neural panels
#   view_postprocessed_advanced — adds sticker spheres + hand mesh (ICP+PCA)
# ==============================================================================

parameters:
  kinect_configs: valid_configs_ST14-04

tasks:
  view_forearm_stage_inspector:
    enabled: true
    description: "Launch ForearmStageInspector: single window with session and stage
      dropdowns to inspect forearm pointclouds at Raw, PCA-Calibrated, and RF-Centered
      stages. Optional Delaunay mesh overlay. Runs once per batch (session-level)."
    options: {}
    depends_on: []

  view_postprocessed_simple:
    enabled: false
    description: "Launch PostprocessedSceneViewer in simple mode: static PCA-calibrated
      forearm PLY + per-frame projected contact points + NeuralDataPanel."
    options: {}
    depends_on: []

  view_postprocessed_advanced:
    enabled: false
    description: "Launch PostprocessedSceneViewer in advanced mode: adds per-frame
      sticker spheres (PCA-calibrated) and a hand mesh with ICP+PCA transform chain.
      Degrades gracefully when hand motion NPZ, ICP transforms, or PCA calib are missing."
    options: {}
    depends_on: []

  view_before_after_steps:
    enabled: false
    description: "Launch BeforeAfterStepViewer for each of the 5 postprocessing steps
      (ICP registration, XY deduplication, contact projection, PCA calibration, RF
      centering). Opens one side-by-side dual-plotter window per step sequentially;
      steps with missing intermediate data are skipped with a warning."
    options: {}
    depends_on: []

  view_postprocessing_stages:
    enabled: true
    description: "Launch PostprocessingStageViewer: single window with stage dropdown
      to switch between all 6 postprocessing stages (Merged, ICP Registered, Deduplicated,
      Contact Projected, PCA Calibrated, RF Centered). Shows forearm PLY, contact
      points, and NeuralDataPanel for each stage."
    options: {}
    depends_on: []
