# =============================================================================
# FOREARM EXTRACTION PIPELINE CONFIGURATION & TASK GRAPH (DAG)
# =============================================================================

parameters:
  forearm_configs_directory: "forearm_configs"
  force_session_processing: true  # Controls .SUCCESS flag skipping

  forearm_config_files:
  - session_2022-06-14_ST13-03.yaml
tasks:
  # Step 1: Interactive forearm segmentation (ROI annotation + point cloud extraction)
  extract_forearm:
    enabled: true
    options:
      force_processing: false
    depends_on: []

  # Step 2: Manual artifact removal GUI (box-select and remove unwanted points)
  curate_forearm:
    enabled: true
    options:
      force_processing: false
    depends_on: [extract_forearm]

  # Step 3: Point cloud noise removal
  clean_forearm:
    enabled: true
    options:
      force_processing: false
    depends_on: [curate_forearm]

  # Step 4: Surface normal estimation
  define_normals:
    enabled: true
    options:
      force_processing: false
    depends_on: [clean_forearm]

  # Step 5: Mesh reconstruction
  build_mesh:
    enabled: true
    options:
      force_processing: false
    depends_on: [define_normals]

  # Step 6: Multi-snapshot ICP registration
  register_forearms:
    enabled: true
    options:
      force_processing: true
    depends_on: [build_mesh]
