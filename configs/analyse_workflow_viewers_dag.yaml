# Dependency-aware configuration for the Analysis Workflow — Viewer tasks only.
# Specifies input directories and task toggle states for interactive viewer tasks.
# Processing outputs (CSVs, heatmaps, etc.) are assumed to exist on disk.
# See analyse_workflow_dag.yaml for the combined reference config.

parameters:
  # List of directories containing Kinect session config files to scan.
  # Paths are relative to configs/kinect_configs/.
  kinect_configs: [valid_configs_ST13-01, valid_configs_ST13-02, 
      valid_configs_ST13-03, valid_configs_ST14-01, valid_configs_ST14-02, 
      valid_configs_ST14-04, valid_configs_ST15-01, valid_configs_ST16-02, 
      valid_configs_ST16-03, valid_configs_ST16-05, valid_configs_ST18-01, 
      valid_configs_ST18-04]

tasks:
  # ============================================================
  # Viewer Support — utility tasks required by viewer tasks
  # ============================================================

  # Pre-computes .npz sidecar caches for the RF Feature-Space Explorer.
  # Runs load_explorer_data() for all sessions in parallel (ThreadPoolExecutor)
  # so the GUI task below opens instantly on a cache hit. Internally idempotent:
  # sessions with a fresh cache are skipped automatically.
  explore_precompute_caches:
    category: viewer_support
    enabled: false
    options:
      force_processing: false
      max_workers: 1
    depends_on: []

  # ============================================================
  # Viewer Tasks — launch interactive PyQt5 GUIs
  # ============================================================

  # Touch Preparation Viewer: visual inspection of preparation pipeline output.
  # Displays per-touch time-series (contact_depth, area, location, neural data)
  # and a 3D forearm view with contact centroid per frame.
  # Output: interactive GUI (no files written)
  explore_preparation:
    category: viewer
    enabled: false
    options:
      force_processing: false
    depends_on: []

  # RF Feature-Space Explorer: interactive GUI for sweeping the feature space and
  # visualising the corresponding RF heatmap in real time. Opens instantly when
  # explore_precompute_caches has already warmed the .npz sidecars.
  explore_feature_space:
    category: viewer
    enabled: false
    options:
      force_processing: false
    depends_on: [explore_precompute_caches]

  # Touch Playback Explorer: frame-by-frame animation of individual touch events on the 3D
  # forearm model with accumulating spike heatmap. Opens instantly when series CSVs are cached.
  explore_touch_playback:
    category: viewer
    enabled: false
    options:
      force_processing: false
    depends_on: []

  # Single-Touch RF Explorer: per-touch RF heatmap viewer on the 3D forearm model.
  # Cascading Session / Block / Trial / Touch dropdowns render the pre-computed
  # per-touch RF map from single_touch_rf_maps.npz (produced by spatial_map_single_touch).
  # Output: interactive GUI (no files written)
  explore_single_touch_rf:
    category: viewer
    enabled: false
    options:
      force_processing: false
      neuron_mode: iff
      iff_metric: mean
    depends_on: []

  # Touch Population Explorer: per-touch scatter (configurable feature axes) + 3D forearm heatmap.
  # One dot per single touch; draggable rectangle + gesture checkboxes filter the heatmap in real time.
  # Three heatmap modes: spike density, mean IFF, cumulative IFF.
  # Output: interactive GUI (no files written)
  explore_touch_population:
    category: viewer
    enabled: false
    options:
      force_processing: false
      neuron_mode: iff
      iff_metric: mean
    depends_on: []

  # RF Cluster Gallery Viewer: interactive gallery of RF heatmaps with thumbnail sidebar and
  # 3D PyVista view. Iterates all enabled cluster_groups and clusterers from stimulus_cluster_touches.
  # Replaces the gallery_viewer option on cross_render_cluster_rf (now deprecated).
  # Output: interactive GUI (no files written)
  explore_rf_gallery:
    category: viewer
    enabled: false
    options:
      force_processing: false
      cluster_groups: [pressure_velocity_mean_cartesian_binning]
    depends_on: []

  # RF Surface Viewer: interactive 3D surface where Z = mean IFF intensity,
  # coloured by jet colormap. Loads _population_response_fields.npz produced
  # by spatial_extract_boundaries. Session and gesture-type selectable via
  # combo boxes.
  # Output: interactive GUI (no files written)
  explore_rf_surface:
    category: viewer
    enabled: true
    options:
      force_processing: false
      neuron_mode: iff
    depends_on: []
